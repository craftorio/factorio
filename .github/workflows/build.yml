name: Build

on:
  schedule:
    # Every 2 hours: check factorio.com for a new release and build only if one appeared.
    - cron: "7 */2 * * *"
    # Daily: full rebuild regardless, to pick up refreshed base images.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - stable/**
      - experimental/**
      - scripts/update-versions.sh
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  versions:
    name: Check Factorio releases
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.check.outputs.stable }}
      experimental: ${{ steps.check.outputs.experimental }}
      changed: ${{ steps.check.outputs.changed }}
      dockerhub: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Fetch latest versions and sync repo files
        id: check
        run: ./scripts/update-versions.sh

      - name: Commit version bump
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable/VERSION experimental/VERSION README.md README_uk.md CHANGELOG.md
          git commit -m "Factorio stable ${{ steps.check.outputs.stable }} / experimental ${{ steps.check.outputs.experimental }}"
          git push origin HEAD:main

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN secret is not set, pushing to GHCR only"
          fi

  # Build each architecture natively on its own runner and push by digest.
  # Scheduled version checks build only when a new Factorio release was found;
  # the daily cron, pushes and manual runs always build.
  build:
    name: ${{ matrix.channel }} / ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: versions
    if: >-
      needs.versions.outputs.changed == 'true' ||
      github.event_name != 'schedule' ||
      github.event.schedule == '17 4 * * *'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, experimental]
        variant: [debian, alpine]
        arch: [amd64, arm64]
    env:
      VERSION: ${{ matrix.channel == 'stable' && needs.versions.outputs.stable || needs.versions.outputs.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Build metadata
        id: args
        run: |
          {
            echo "vcs_ref=$(git rev-parse --short HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "dockerfile=./${{ matrix.channel }}/Dockerfile${{ matrix.variant == 'alpine' && '.alpine' || '' }}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ needs.versions.outputs.dockerhub == 'true' }}
          labels: |
            org.opencontainers.image.vendor=Craftorio
            org.opencontainers.image.title=Factorio Headless Server
            org.opencontainers.image.description=Factorio headless server (${{ matrix.channel }}, ${{ matrix.variant }})
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.versions.outputs.dockerhub == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.channel }}
          file: ${{ steps.args.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.GHCR_IMAGE }}${{ needs.versions.outputs.dockerhub == 'true' && format(',{0}', env.DOCKERHUB_IMAGE) || '' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ steps.args.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.args.outputs.build_date }}

      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh "${GHCR_IMAGE}@${{ steps.build.outputs.digest }}" \
            -c 'uname -m && /opt/factorio/bin/*/factorio --version'

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.channel }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch images into one multi-arch manifest per tag.
  manifest:
    name: ${{ matrix.channel }} / ${{ matrix.variant }} manifest
    needs: [versions, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, experimental]
        variant: [debian, alpine]
    env:
      VERSION: ${{ matrix.channel == 'stable' && needs.versions.outputs.stable || needs.versions.outputs.experimental }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.channel }}-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.GHCR_IMAGE }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ needs.versions.outputs.dockerhub == 'true' }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'alpine' && '-alpine' || '' }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.channel == 'stable' }}
            type=raw,value=stable,enable=${{ matrix.channel == 'stable' }}
            type=raw,value=experimental,enable=${{ matrix.channel == 'experimental' }}
            type=raw,value=${{ env.VERSION }},enable=${{ matrix.channel == 'stable' || needs.versions.outputs.stable != needs.versions.outputs.experimental }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.versions.outputs.dockerhub == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          for image in "$GHCR_IMAGE" ${{ needs.versions.outputs.dockerhub == 'true' && '"$DOCKERHUB_IMAGE"' || '' }}; do
            tags=$(jq -cr --arg img "$image" '.tags | map(select(startswith($img + ":"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $tags $(printf "$image@sha256:%s " *)
          done

      - name: Inspect
        run: |
          jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON" | while read -r tag; do
            docker buildx imagetools inspect "$tag"
          done
