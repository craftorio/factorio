name: Build

on:
  schedule:
    # Daily: pick up new Factorio releases and refreshed base images.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - stable/**
      - experimental/**
      - scripts/update-versions.sh
      - .github/workflows/build.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  versions:
    name: Check Factorio releases
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.check.outputs.stable }}
      experimental: ${{ steps.check.outputs.experimental }}
      changed: ${{ steps.check.outputs.changed }}
      dockerhub: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Fetch latest versions and sync repo files
        id: check
        run: ./scripts/update-versions.sh

      - name: Commit version bump
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable/VERSION experimental/VERSION README.md CHANGELOG.md
          git commit -m "Factorio stable ${{ steps.check.outputs.stable }} / experimental ${{ steps.check.outputs.experimental }}"
          git push origin HEAD:main

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_TOKEN secret is not set, pushing to GHCR only"
          fi

  build:
    name: ${{ matrix.channel }} / ${{ matrix.variant }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, experimental]
        variant: [debian, alpine]
    env:
      VERSION: ${{ matrix.channel == 'stable' && needs.versions.outputs.stable || needs.versions.outputs.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Build metadata
        id: args
        run: |
          {
            echo "vcs_ref=$(git rev-parse --short HEAD)"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "dockerfile=./${{ matrix.channel }}/Dockerfile${{ matrix.variant == 'alpine' && '.alpine' || '' }}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=ghcr.io/${{ github.repository }}
            name=docker.io/${{ github.repository }},enable=${{ needs.versions.outputs.dockerhub == 'true' }}
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'alpine' && '-alpine' || '' }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.channel == 'stable' }}
            type=raw,value=stable,enable=${{ matrix.channel == 'stable' }}
            type=raw,value=experimental,enable=${{ matrix.channel == 'experimental' }}
            type=raw,value=${{ env.VERSION }},enable=${{ matrix.channel == 'stable' || needs.versions.outputs.stable != needs.versions.outputs.experimental }}
          labels: |
            org.opencontainers.image.vendor=Craftorio
            org.opencontainers.image.title=Factorio Headless Server
            org.opencontainers.image.description=Factorio headless server (${{ matrix.channel }}, ${{ matrix.variant }})
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.versions.outputs.dockerhub == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.channel }}
          file: ${{ steps.args.outputs.dockerfile }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            VCS_REF=${{ steps.args.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.args.outputs.build_date }}
