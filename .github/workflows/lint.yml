name: Lint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - scripts/**
      - docker-compose.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: actionlint, shellcheck, compose config
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@v2

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
