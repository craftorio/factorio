# Factorio headless server with automatic updates.
#
#   mkdir -p /opt/factorio && cp docker-compose.yml /opt/factorio/ && cd /opt/factorio
#   docker compose up -d
#
# Run `docker compose` from this directory: the updater job mounts the project
# directory by its absolute path (${PWD}) so that compose inside the job
# resolves ./data to the same host directory.
#
# ./data is mounted as /factorio and keeps config/, mods/, saves/ and scenarios/.
# Put server-settings.json, server-adminlist.json etc. into ./data/config.
#
# Images are rebuilt by GitHub Actions whenever a new Factorio release appears
# (checked every 2 hours) and once a day on top of that. The ofelia job below
# checks every 15 minutes whether a newer image was published and recreates the
# server when it was. Use the `stable` tag for the stable channel or
# `experimental` for the experimental one.

services:
  factorio:
    image: ghcr.io/craftorio/factorio:latest
    container_name: factorio
    restart: always
    ports:
      - "0.0.0.0:27015:27015"
      - "0.0.0.0:34197:34197/udp"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./data:/factorio
    environment:
      - FACTORIO_PORT=34197
      - FACTORIO_RCON_PORT=27015

  # Scheduler: every 15 minutes pull the image and recreate the server if it changed.
  # Remove this service if you prefer to update manually with `docker compose pull && docker compose up -d`.
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: factorio-ofelia
    restart: always
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: "true"
      ofelia.job-run.factorio-update.schedule: "@every 15m"
      ofelia.job-run.factorio-update.no-overlap: "true"
      ofelia.job-run.factorio-update.image: "docker:cli"
      ofelia.job-run.factorio-update.volume: '["/var/run/docker.sock:/var/run/docker.sock", "${PWD}:${PWD}"]'
      ofelia.job-run.factorio-update.command: "sh -c 'cd ${PWD} && docker compose pull -q factorio && docker compose up -d factorio && docker image prune -f'"
